name: Publicar no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /Spotify-enfermagem
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7
      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Configurar o Pages
        uses: actions/configure-pages@v6
      - name: Instalar dependências
        run: npm ci
      - name: Gerar site estático
        run: npm run build:pages
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
